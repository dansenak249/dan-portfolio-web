name: VGen Collectors

# Two independent jobs share this file because they share a trigger and a
# secret, not because they are related:
#   collect - the trending snapshot (unchanged; see the note below)
#   rotate  - the service-data category refresh
# They run in parallel and in separate concurrency lanes, so neither can delay
# the other.
#
# ---- collect ----------------------------------------------------------------
# BACKUP trigger only. The PRIMARY trigger is an external pinger (cron-job.org)
# that POSTs to /api/vgen-trending/collect directly, because GitHub's scheduled
# cron proved unreliable for this repo (it dropped ~94% of slots on 2026-06-15,
# firing only once in 12h). This workflow is kept as a harmless free backup: the
# /collect endpoint self-throttles, so an extra trigger is a cheap no-op unless
# the newest snapshot is already older than ~45 min.
#
# It still just pings the deployed /collect endpoint, which does the actual
# fetching + Redis storage on Vercel (PC can stay off).

on:
  schedule:
    # Best-effort hourly backup at an off-peak minute. Real cadence comes from
    # the cron-job.org pinger; if GitHub happens to fire, the throttle prevents
    # any duplicate snapshot.
    - cron: "37 * * * *"
  # Manual "Run workflow" button in the Actions tab, for testing.
  workflow_dispatch:
    inputs:
      rotate_ticks:
        description: "How many rotation ticks to run (service-data refresh)"
        required: false
        default: "40"

jobs:
  collect:
    runs-on: ubuntu-latest
    # Concurrency is per-job, not workflow-wide: a rotation run can last minutes,
    # and a shared lane would queue the next trending snapshot behind it.
    # If a previous run is still going, don't pile up a second one.
    concurrency:
      group: vgen-collect
      cancel-in-progress: false
    steps:
      - name: Trigger collection
        env:
          SITE_URL: ${{ secrets.VGEN_SITE_URL }}
          COLLECT_SECRET: ${{ secrets.VGEN_COLLECT_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          BASE="${SITE_URL%/}"
          # Manual "Run workflow" bypasses the server-side throttle so it always
          # collects immediately; scheduled runs respect the ~45 min throttle.
          URL="${BASE}/api/vgen-trending/collect"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            URL="${URL}?force=1"
          fi
          # /collect is synchronous: a 2xx response means the snapshot is already
          # stored in Redis. So validation == the HTTP result. Retry up to 3 times
          # on transient failure (timeout / 5xx / lock contention) within this run.
          max=3
          attempt=1
          while [ "$attempt" -le "$max" ]; do
            echo "Attempt ${attempt}/${max}: POST ${URL}"
            if curl --fail-with-body --silent --show-error \
                --max-time 120 \
                -X POST "${URL}" \
                -H "Authorization: Bearer ${COLLECT_SECRET}" \
                -H "Content-Type: application/json"; then
              echo ""
              echo "Collection confirmed stored."
              exit 0
            fi
            echo ""
            echo "Attempt ${attempt} failed."
            attempt=$((attempt + 1))
            if [ "$attempt" -le "$max" ]; then sleep 30; fi
          done
          echo "All ${max} attempts failed."
          exit 1

  # ---- rotate ----------------------------------------------------------------
  # Walks the categories ticked "Auto" in the dashboard's category map, one
  # bounded slice per POST: crawl the listing, then pull reviews, then move on.
  #
  # Nothing here tracks progress. /rotate keeps its own position in Redis and
  # advances it only when a phase reports done, so a dropped schedule slot, an
  # overlapping run or a cancelled job costs at most one repeated slice. That is
  # what makes GitHub's unreliable cron acceptable HERE, unlike for the trending
  # snapshot above: a missed tick makes the refresh slower, never wrong.
  rotate:
    runs-on: ubuntu-latest
    concurrency:
      group: vgen-rotate
      cancel-in-progress: false
    steps:
      - name: Tick the service-data rotation
        env:
          SITE_URL: ${{ secrets.VGEN_SITE_URL }}
          COLLECT_SECRET: ${{ secrets.VGEN_COLLECT_SECRET }}
          MAX_TICKS: ${{ github.event.inputs.rotate_ticks || '40' }}
          # Measured at ~17-24s per tick, so 40 ticks is roughly 11-16 minutes
          # and this ceiling rarely binds. It exists so a run of unusually slow
          # ticks ends on its own terms rather than at the runner's 6-hour limit.
          # Public repo, so runner minutes are free; the reason not to go higher
          # is that the vgen-rotate concurrency group makes the next run queue
          # behind this one.
          BUDGET_SECONDS: "2400"
        run: |
          set -uo pipefail
          BASE="${SITE_URL%/}"
          URL="${BASE}/api/vgen-service-data/rotate"
          started=$(date +%s)
          ok=0
          failed=0

          for i in $(seq 1 "${MAX_TICKS}"); do
            elapsed=$(( $(date +%s) - started ))
            if [ "${elapsed}" -ge "${BUDGET_SECONDS}" ]; then
              echo "Budget spent after $((i - 1)) tick(s); stopping."
              break
            fi
            echo "--- tick ${i}/${MAX_TICKS} (t+${elapsed}s)"

            body=$(curl --silent --show-error --max-time 90 \
              -X POST "${URL}" \
              -H "Authorization: Bearer ${COLLECT_SECRET}" \
              -H "Content-Type: application/json" \
              -d '{}') || body=""

            if [ -z "${body}" ]; then
              echo "  no response from ${URL}"
              failed=$((failed + 1)); sleep 20; continue
            fi
            # A dead function answers with an HTML error page, not JSON.
            if ! echo "${body}" | jq -e . >/dev/null 2>&1; then
              echo "  non-JSON response: $(echo "${body}" | head -c 200)"
              failed=$((failed + 1)); sleep 20; continue
            fi
            # Nothing is ticked for auto refresh. That is a valid state, not a
            # failure, and no amount of retrying will change it.
            if [ "$(echo "${body}" | jq -r '.idle // false')" = "true" ]; then
              echo "  no categories are ticked for Auto in the category map; nothing to do"
              exit 0
            fi
            if [ "$(echo "${body}" | jq -r '.ok // false')" != "true" ]; then
              echo "  tick failed: $(echo "${body}" | jq -r '.error // .')"
              failed=$((failed + 1)); sleep 20; continue
            fi

            ok=$((ok + 1))
            echo "  ran $(echo "${body}" | jq -r '.ranPhase') for $(echo "${body}" | jq -r '.ranCategory')"
            echo "  next: $(echo "${body}" | jq -r '.next.label') / $(echo "${body}" | jq -r '.next.phase') (cycles $(echo "${body}" | jq -r '.cycles'))"
            sleep 3
          done

          echo ""
          echo "${ok} tick(s) succeeded, ${failed} failed."
          # The position is left untouched on a failed tick, so the next one
          # simply retries the same slice. A few bad ticks are not worth a red
          # run; a run where nothing at all got through is.
          if [ "${ok}" -eq 0 ]; then
            echo "No tick succeeded."
            exit 1
          fi
